<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="达人库合成数据交互演示">
  <meta name="theme-color" content="#0b1020">
  <title>达人库 · 合成数据演示</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%234f8cff'/%3E%3Ctext x='32' y='41' text-anchor='middle' font-family='Arial' font-size='25' font-weight='700' fill='white'%3EDL%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="./demo.css">
</head>
<body>
  <a class="skip-link" href="#app">跳到主要内容</a>
  <header class="topbar">
    <div class="shell topbar-inner">
      <a class="brand" href="#/dashboard" aria-label="达人库演示首页">
        <span class="brand-mark" aria-hidden="true">DL</span>
        <span><strong>Daren Library</strong><small>合成数据交互演示</small></span>
      </a>
      <nav class="primary-nav" aria-label="主要导航">
        <a href="#/dashboard" data-nav="dashboard">看板</a>
        <a href="#/creators" data-nav="creators">达人列表</a>
        <a href="#/compare" data-nav="compare">对比 <span id="compare-count" class="nav-count">0</span></a>
      </nav>
      <div class="synthetic-chip" title="页面只读取仓库内的合成数据">
        <span class="status-dot" aria-hidden="true"></span>100% 合成数据
      </div>
    </div>
  </header>

  <main id="app" class="shell main" tabindex="-1" aria-live="polite">
    <section class="loading-state" aria-label="正在加载演示数据">
      <div class="loading-copy">
        <span class="eyebrow">正在读取 demo_data.json</span>
        <h1>准备达人数据</h1>
        <p id="loading-label">正在加载本地合成数据…</p>
      </div>
      <div class="progress-track" aria-hidden="true"><span id="loading-progress"></span></div>
      <div class="skeleton-grid">
        <span></span><span></span><span></span><span></span><span></span>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="shell footer-inner">
      <span>仅用于界面体验，不含真实业务数据</span>
      <span id="data-timestamp">数据加载中</span>
    </div>
  </footer>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript><div class="noscript">此演示需要启用 JavaScript。</div></noscript>
  <script src="./app.js" defer></script>
</body>
</html>
